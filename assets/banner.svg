<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Laser Scanner Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(96, 165, 250, 0.2)"/>
    </pattern>

    <!-- Radial Glow Behind Title -->
    <radialGradient id="centerAura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sweepLine {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(390px); opacity: 0; }
    }
    @keyframes pulseAura {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.04); }
    }
    @keyframes floatParticle1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(15px, -18px); }
    }
    @keyframes floatParticle2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-20px, 15px); }
    }
    @keyframes floatParticle3 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(18px, 14px); }
    }
    @keyframes pulseWave {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.55; }
    }

    .scanner-beam {
      animation: sweepLine 6s ease-in-out infinite;
    }
    .aura-bg {
      animation: pulseAura 8s ease-in-out infinite;
      transform-origin: center;
    }
    .particle-1 { animation: floatParticle1 7s ease-in-out infinite; }
    .particle-2 { animation: floatParticle2 9s ease-in-out infinite; }
    .particle-3 { animation: floatParticle3 8s ease-in-out infinite; }
    .wave-line { animation: pulseWave 4s ease-in-out infinite; }

    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #93c5fd;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      fill: #cbd5e1;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1280" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Perspective Tech Grid -->
  <rect width="1280" height="420" rx="16" fill="url(#grid)"/>

  <!-- Animated Ambient Aura Glow -->
  <circle class="aura-bg" cx="640" cy="180" r="320" fill="url(#centerAura)"/>

  <!-- Background Animated Particles / Wave Elements -->
  <g opacity="0.6">
    <circle class="particle-1" cx="220" cy="90" r="3" fill="#60a5fa" filter="url(#softGlow)"/>
    <circle class="particle-2" cx="1060" cy="120" r="4" fill="#a855f7" filter="url(#softGlow)"/>
    <circle class="particle-3" cx="180" cy="310" r="3" fill="#ec4899" filter="url(#softGlow)"/>
    <circle class="particle-1" cx="1120" cy="290" r="3.5" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle class="particle-2" cx="340" cy="340" r="2.5" fill="#818cf8"/>
    <circle class="particle-3" cx="940" cy="70" r="2.5" fill="#c084fc"/>

    <!-- Subtle Wave Vectors -->
    <path class="wave-line" d="M 60 210 Q 320 160 640 210 T 1220 210" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1.5" stroke-dasharray="6,6"/>
    <path class="wave-line" d="M 60 230 Q 320 280 640 230 T 1220 230" fill="none" stroke="rgba(236, 72, 153, 0.2)" stroke-width="1.5" stroke-dasharray="4,8"/>
  </g>

  <!-- Dynamic Scanner Beam Sweeping Down Behind Text Layer -->
  <g class="scanner-beam">
    <rect x="40" y="10" width="1200" height="2" fill="url(#laserGrad)" filter="url(#softGlow)"/>
    <rect x="40" y="8" width="1200" height="6" fill="url(#laserGrad)" opacity="0.3"/>
  </g>

  <!-- Foreground Dark Glass Container (Shields Text From Any Dynamic Element) -->
  <rect x="120" y="42" width="1040" height="336" rx="20" fill="rgba(15, 23, 42, 0.72)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Top Category Pill / Kicker -->
  <g transform="translate(485, 68)">
    <rect x="0" y="0" width="310" height="28" rx="14" fill="rgba(59, 130, 246, 0.16)" stroke="rgba(96, 165, 250, 0.45)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#60a5fa" filter="url(#softGlow)"/>
    <text x="30" y="18" class="badge-text">CURATED ECOSYSTEM • 2026</text>
  </g>

  <!-- Main Title in Foreground -->
  <text x="640" y="152" text-anchor="middle" class="main-title" fill="url(#titleGrad)" filter="url(#softGlow)">Awesome AI Video Watermark Remover</text>

  <!-- Subtitle in Foreground -->
  <text x="640" y="196" text-anchor="middle" class="subtitle-text">
    State-of-the-Art Deep Learning Models • Temporal Flow Inpainting • Open-Source Frameworks &amp; Enterprise SaaS
  </text>

  <!-- Foreground Metric / Feature Tags (High Contrast Pills) -->
  <g transform="translate(160, 246)">
    <!-- Pill 1: Video Inpainting -->
    <g transform="translate(0, 0)">
      <rect width="175" height="42" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(96, 165, 250, 0.35)" stroke-width="1.2"/>
      <text x="20" y="26" font-size="16">🎬</text>
      <text x="46" y="26" class="pill-label">Video Inpainting</text>
    </g>

    <!-- Pill 2: Temporal Consistency -->
    <g transform="translate(190, 0)">
      <rect width="195" height="42" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2"/>
      <text x="20" y="26" font-size="16">⚡</text>
      <text x="46" y="26" class="pill-label">Temporal Flow</text>
    </g>

    <!-- Pill 3: Florence-2 & LaMa -->
    <g transform="translate(400, 0)">
      <rect width="185" height="42" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(236, 72, 153, 0.35)" stroke-width="1.2"/>
      <text x="20" y="26" font-size="16">🧠</text>
      <text x="46" y="26" class="pill-label">Florence-2 &amp; LaMa</text>
    </g>

    <!-- Pill 4: Zero Ghosting -->
    <g transform="translate(600, 0)">
      <rect width="170" height="42" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(34, 197, 94, 0.35)" stroke-width="1.2"/>
      <text x="20" y="26" font-size="16">🛡️</text>
      <text x="46" y="26" class="pill-label">Zero Ghosting</text>
    </g>

    <!-- Pill 5: Open-Source & SaaS -->
    <g transform="translate(785, 0)">
      <rect width="175" height="42" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.2"/>
      <text x="20" y="26" font-size="16">🚀</text>
      <text x="46" y="26" class="pill-label">Open-Source &amp; API</text>
    </g>
  </g>

  <!-- Interactive / Status Bar at Bottom of Inner Card -->
  <g transform="translate(160, 316)">
    <text x="480" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.5">
      ⭐ Star the repository on GitHub to support open-source video restoration research
    </text>
  </g>

  <!-- Outer Neon Border Frame with Rounded Corners -->
  <rect x="1.5" y="1.5" width="1277" height="417" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" opacity="0.85"/>
</svg>
